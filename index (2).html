<body>
  <a class="skip-link" href="#screen">Skip to learning content</a>
  <div class="ambient one" aria-hidden="true"></div><div class="ambient two" aria-hidden="true"></div>
  <div class="shell">
    <header class="site-header">
      <div class="brand"><div class="brand-symbol" aria-hidden="true">🧠</div><div><div class="brand-title">AI Literacy <span>Quest!</span></div><div class="brand-sub">ADNOC Schools – Madinat Zayed</div></div></div>
      <div class="header-meta"><span class="pill green">✦ Grade 8</span><span class="pill gold">Term 1 · 2026</span></div>
    </header>
    <main id="screen" tabindex="-1"></main>
    <footer class="footer"><span><strong>AI Literacy Quest</strong> · Based on “Term 1 AI Literacy Practice Questions 2026,” ADNOC Schools – Madinat Zayed.</span><span>20 questions · 4 missions · Practice and exam modes</span></footer>
  </div>
  <script>
  'use strict';
  // This is a static, self-contained educational page. No network, accounts, or analytics are used.
  const STORE_KEY = 'adnoc-g8-ai-literacy-quest-2026-v1';
  const CHAPTERS = [
    {icon:'🚌',short:'Smart Bus',title:'The Smart Bus Challenge',strand:'AI Conceptual Understanding',subtitle:'Can better information lead to better predictions?',ambient:'#e9deff',label:'Mission 01',range:'Q1–Q5',scenario:`<p><strong>Scenario (Q1–Q5):</strong> The bus company wants an AI to guess how many students ride each day. Two designs were tested on the same 20 days.</p><div class="responsive-table"><table class="scenario-grid"><thead><tr><th>Design</th><th>What it uses</th><th>Days right (out of 20)</th></tr></thead><tbody><tr><td class="number-cell">A</td><td>Last week’s riders only</td><td>9</td></tr><tr><td class="number-cell">B</td><td>Last week’s riders, the weather and school events</td><td>17</td></tr></tbody></table></div>`,words:[['accuracy','days right ÷ total days × 100'],['trade-off','what you give up to gain something'],['evidence','facts and numbers that support a claim']]},
    {icon:'💡',short:'Maths Tip',title:'The Maths Tip Lab',strand:'AI Solution Design and Development',subtitle:'Build, test and refine a helpful AI solution.',ambient:'#d9f8f4',label:'Mission 02',range:'Q6–Q10',scenario:`<p><strong>Scenario (Q6–Q10):</strong> Task: build a helper for the Weekly Maths Tip. Test 1 gave a tip with 70 words. The target is 25 words.</p><div class="flow-steps" role="img" aria-label="Input: Topic of the week, no student names; Process: the AI writes a short tip; Output: tip for the class board"><div class="flow-node"><b>INPUT</b>Topic of the week (no student names)</div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node"><b>PROCESS</b>The AI writes a short tip</div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node"><b>OUTPUT</b>Tip for the class board</div></div>`,words:[['refine','change something to make it better'],['test step','a step that checks the output'],['refinement log','a record of changes and results']]},
    {icon:'🎤',short:'Spelling Coach',title:'The Spelling Coach Test',strand:'Critical Evaluation and Informed Interaction',subtitle:'Judge AI reliability across different conditions.',ambient:'#ffe8d9',label:'Mission 03',range:'Q11–Q15',scenario:`<p><strong>Scenario (Q11–Q15):</strong> A Spelling Coach AI was tested 50 times.</p><div class="responsive-table"><table class="scenario-grid"><thead><tr><th>Place</th><th>Tests</th><th>Correct</th></tr></thead><tbody><tr><td>Quiet room</td><td>25</td><td>22</td></tr><tr><td>Busy hall</td><td>25</td><td>13</td></tr></tbody></table></div>`,words:[['accuracy','correct ÷ tests × 100'],['gap','the difference between two accuracies'],['reliable','works well in all conditions']]},
    {icon:'🛡️',short:'Fairness Quest',title:'The Fairness Quest',strand:'Ethics & Governance',subtitle:'Protect privacy, support fairness and keep people involved.',ambient:'#ffe0ee',label:'Mission 04',range:'Q16–Q20',scenario:`<p><strong>Scenario (Q16–Q20):</strong> A Homework Points AI gives points to students. It reads photos of their notebooks.</p><div class="responsive-table"><table class="scenario-grid"><thead><tr><th>Problem</th><th>What happens</th></tr></thead><tbody><tr><td class="number-cell">P1</td><td>The photos sometimes show other students’ names.</td></tr><tr><td class="number-cell">P2</td><td>It reads untidy handwriting badly, so some students always get fewer points.</td></tr><tr><td class="number-cell">P3</td><td>Prizes use the AI points only. No teacher checks.</td></tr></tbody></table></div>`,words:[['personal data','information about a person'],['fairness','treating people equally'],['governance rule','who is responsible and what rule applies']]}
  ];
  // Source wording, word banks, answer key, and the specified accepted alternatives are retained.
  // kind: auto = objective auto-check; open = student reviews wording against model answer.
  const QUESTIONS = [
    {id:1,chapter:0,dok:2,prompt:'Complete the table. (1 mark)',body:'{{accuracyTable}}',fields:{a:{kind:'auto',label:'Design A accuracy',correct:['45','45%']},b:{kind:'auto',label:'Design B accuracy',correct:['85','85%']}},model:'<strong>Design A:</strong> 45%<br><strong>Design B:</strong> 85%',note:'Accuracy = days right ÷ 20 × 100.'},
    {id:2,chapter:0,dok:2,prompt:'Which design is better? (1 mark)',body:'{{choice}}',options:[['A','Design A'],['B','Design B'],['C','They are the same'],['D','We cannot tell']],fields:{choice:{kind:'auto',label:'Design choice',correct:['B']}},model:'<strong>B. Design B</strong> – Design B was right more often.'},
    {id:3,chapter:0,dok:2,prompt:'Why is it better? (1 mark)',body:'{{choice}}',options:[['A','It uses more useful information (weather and school events)'],['B','It is older'],['C','It costs less'],['D','It has a longer name']],fields:{choice:{kind:'auto',label:'Reason',correct:['A']}},model:'<strong>A. It uses more useful information (weather and school events)</strong> – More useful inputs.'},
    {id:4,chapter:0,dok:3,prompt:'Fill in the blanks. Use the word bank. (1 mark)',bank:['data','noisy','steady','photos'],body:'<p>Trade-off of Design B: it needs more {{data}} to collect and keep up to date.</p><p>Design A is enough when ridership is very {{steady}}.</p><p>Why is A enough then?</p>{{reason}}',fields:{data:{kind:'auto',label:'What Design B needs more of',correct:['data']},steady:{kind:'auto',label:'Ridership pattern',correct:['steady']},reason:{kind:'open',label:'Why is A enough then?'}},model:'Trade-off of Design B: it needs more <strong>data</strong> to collect and keep up to date.<br>Design A is enough when ridership is very <strong>steady</strong>.<br><strong>Model reason:</strong> Extra data adds little when the numbers do not change.',allowEquivalent:true},
    {id:5,chapter:0,dok:3,prompt:'Fill in the blanks. Use the word bank. (1 mark)',bank:['45','17','true','false','useful'],body:'<p>A friend says: “B is better because it uses more data.” This is partly {{partly}}.</p><p>B was right on {{days}} of 20 days. A was right on 9.</p><p>More data only helps if it is {{quality}} data.</p><p>Another test to prove it:</p>{{reason}}',fields:{partly:{kind:'auto',label:'Partly true or false',correct:['true']},days:{kind:'auto',label:'Days right for B',correct:['17']},quality:{kind:'auto',label:'Type of data',correct:['useful']},reason:{kind:'open',label:'Another test to prove it'}},model:'A friend says: “B is better because it uses more data.” This is partly <strong>true</strong>.<br>B was right on <strong>17</strong> of 20 days. A was right on 9.<br>More data only helps if it is <strong>useful</strong> data.<br><strong>Model reason:</strong> Test B again on new days.',allowEquivalent:true},
    {id:6,chapter:1,dok:3,prompt:'Add a test step. Write in the empty box what the test checks. (1 mark)',body:'{{testFlow}}',fields:{test:{kind:'open',label:'What should the test check?'}},model:'<strong>TEST:</strong> Is the tip 25 words or fewer and correct?'},
    {id:7,chapter:1,dok:3,prompt:'Complete the refinement note for Test 1. (1 mark)',body:'{{refinementTable}}',fields:{problem:{kind:'open',label:'Problem found'},change:{kind:'open',label:'Change made'},measure:{kind:'open',label:'Test again and measure'}},model:'<strong>Problem found:</strong> The tip had 70 words. The target is 25.<br><strong>Change made:</strong> Add “at most 25 words” to the prompt.<br><strong>Test again and measure:</strong> Run again and count the words: 25 or fewer.'},
    {id:8,chapter:1,dok:3,prompt:'In Test 2 the topic is empty and the AI makes up a topic. What is the best next step? (1 mark)',body:'{{choice}}',options:[['A','Stop using AI'],['B','Ignore it'],['C','Remove the test step'],['D','Add an instruction: if the topic is empty, say “No topic yet”. Then test again']],fields:{choice:{kind:'auto',label:'Best next step',correct:['D']}},model:'<strong>D. Add an instruction: if the topic is empty, say “No topic yet”. Then test again</strong> – Fix the prompt and test again.'},
    {id:9,chapter:1,dok:3,prompt:'A friend changes the prompt and the topic list together and the tips get better. What is the problem? (1 mark)',body:'{{choice}}',options:[['A','No problem'],['B','We cannot tell which change helped'],['C','The AI is broken'],['D','Changes never work']],fields:{choice:{kind:'auto',label:'Problem',correct:['B']}},model:'<strong>B. We cannot tell which change helped</strong> – Change one thing at a time.'},
    {id:10,chapter:1,dok:3,prompt:'Fill in the refinement log notes. Use the word bank. (1 mark)',bank:['tested','real','changed','result','sold','painted'],body:'<p>A refinement log should show what you {{changed}}, how you {{tested}} it, and what the {{result}} was.</p><p>A log helps others check that the improvement is {{real}}.</p><p>Why does that help?</p>{{reason}}',fields:{changed:{kind:'auto',label:'What you did',correct:['changed']},tested:{kind:'auto',label:'How you did it',correct:['tested']},result:{kind:'auto',label:'What the outcome was',correct:['result']},real:{kind:'auto',label:'Quality of the improvement',correct:['real']},reason:{kind:'open',label:'Why does that help?'}},model:'A refinement log should show what you <strong>changed</strong>, how you <strong>tested</strong> it, and what the <strong>result</strong> was.<br>A log helps others check that the improvement is <strong>real</strong>.<br><strong>Model reason:</strong> Others can repeat the test.',allowEquivalent:true},
    {id:11,chapter:2,dok:3,prompt:'What is the overall accuracy? (1 mark)',body:'{{choice}}',options:[['A','35%'],['B','52%'],['C','70%'],['D','88%']],fields:{choice:{kind:'auto',label:'Overall accuracy',correct:['C']}},model:'<strong>C. 70%</strong> – 35 out of 50 = 70%.'},
    {id:12,chapter:2,dok:3,prompt:'Complete the table. (1 mark)',body:'{{spellingTable}}',fields:{quiet:{kind:'auto',label:'Quiet room accuracy',correct:['88','88%']},busy:{kind:'auto',label:'Busy hall accuracy',correct:['52','52%']},gap:{kind:'auto',label:'Gap (quiet − busy)',correct:['36','36 percentage points','36 pp','36 percentage point']}},model:'<strong>Quiet room accuracy:</strong> 88%<br><strong>Busy hall accuracy:</strong> 52%<br><strong>Gap (quiet − busy):</strong> 36 percentage points.'},
    {id:13,chapter:2,dok:3,prompt:'Fill in the blanks. Use the word bank. (1 mark)',bank:['empty','busy','reliable','quiet','again'],body:'<p>The gap shows the Spelling Coach is much less {{reliable}} in a busy place.</p><p>To improve it, add training examples recorded in {{busy}} places.</p><p>Then test both places {{again}}.</p><p>Why test both places?</p>{{reason}}',fields:{reliable:{kind:'auto',label:'Less of what',correct:['reliable']},busy:{kind:'auto',label:'Training locations',correct:['busy']},again:{kind:'auto',label:'When to test both places',correct:['again']},reason:{kind:'open',label:'Why test both places?'}},model:'The gap shows the Spelling Coach is much less <strong>reliable</strong> in a busy place.<br>To improve it, add training examples recorded in <strong>busy</strong> places.<br>Then test both places <strong>again</strong>.<br><strong>Model reason:</strong> To check the quiet-room accuracy did not drop.',allowEquivalent:true},
    {id:14,chapter:2,dok:3,prompt:'Which evidence best shows the improvement worked? (1 mark)',body:'{{choice}}',options:[['A','More students like the screen'],['B','The maker says it is better'],['C','The accuracy in the busy hall goes up on the same 25 tests'],['D','The app has a new logo']],fields:{choice:{kind:'auto',label:'Best evidence',correct:['C']}},model:'<strong>C. The accuracy in the busy hall goes up on the same 25 tests</strong> – Same tests, better result.'},
    {id:15,chapter:2,dok:3,prompt:'Fill in the blanks. Use the word bank. (1 mark)',bank:['13%','52%','Not yet','Yes','88%'],body:'<p>Use it in the busy hall now? {{use}}.</p><p>In the busy hall, accuracy is only {{busy}}.</p><p>In the quiet room, accuracy is {{quiet}}.</p><p>What would you do next?</p>{{reason}}',fields:{use:{kind:'auto',label:'Use it now?',correct:['Not yet']},busy:{kind:'auto',label:'Busy hall accuracy',correct:['52','52%']},quiet:{kind:'auto',label:'Quiet room accuracy',correct:['88','88%']},reason:{kind:'open',label:'What would you do next?'}},model:'Use it in the busy hall now? <strong>Not yet.</strong><br>In the busy hall, accuracy is only <strong>52%.</strong><br>In the quiet room, accuracy is <strong>88%.</strong><br><strong>Model reason:</strong> Improve it for busy places and test again.',allowEquivalent:true},
    {id:16,chapter:3,dok:3,prompt:'Which type of risk is each problem? Tick (✓) one box in each row. (1 mark)',body:'{{riskGrid}}',fields:{p1:{kind:'auto',label:'P1 risk type',correct:['Privacy']},p2:{kind:'auto',label:'P2 risk type',correct:['Fairness']},p3:{kind:'auto',label:'P3 risk type',correct:['No human check']}},model:'<strong>P1:</strong> Privacy<br><strong>P2:</strong> Fairness<br><strong>P3:</strong> No human check.'},
    {id:17,chapter:3,dok:3,prompt:'Rate each problem. Fill in the blanks. You can use a word more than once. (1 mark)',bank:['low','medium','high'],body:'<p>P1 (names in photos): the risk is {{p1}}.</p><p>P2 (untidy handwriting): the risk is {{p2}}.</p><p>P3 (no teacher check): the risk is {{p3}}.</p><p>Why did you rate P1 like this?</p>{{reason}}',fields:{p1:{kind:'auto',label:'P1 risk level',correct:['high']},p2:{kind:'auto',label:'P2 risk level',correct:['high']},p3:{kind:'auto',label:'P3 risk level',correct:['medium']},reason:{kind:'open',label:'Why did you rate P1 like this?'}},model:'<strong>P1 (names in photos):</strong> high.<br><strong>P2 (untidy handwriting):</strong> high.<br><strong>P3 (no teacher check):</strong> medium.<br><strong>Model reason:</strong> Names are personal data.<br><em>Source marking note: Accept any reasoned rating.</em>',allowEquivalent:true,altNote:'The source answer key accepts other risk ratings when they are supported by a sound reason.'},
    {id:18,chapter:3,dok:3,prompt:'Which problem should be fixed first? Fill in the blank. Use the word bank. (1 mark)',bank:['P1','P4','P3'],body:'<p>I would fix problem {{fix}} first.</p><p>Because:</p>{{reason}}',fields:{fix:{kind:'auto',label:'Problem to fix first',correct:['P1','P2']},reason:{kind:'open',label:'Why fix this problem first?'}},model:'I would fix problem <strong>P1</strong> first.<br><strong>Model reason:</strong> Names are personal data that could be shared.<br><em>Source marking note: P2 is also accepted with a fairness reason, even though P2 is not listed in this question’s word bank.</em>',altNote:'If you chose P2, your reason must explain the fairness risk for students with untidy handwriting.'},
    {id:19,chapter:3,dok:3,prompt:'Fill in the blanks. Use the word bank. (1 mark)',bank:['pens','names','teacher','pupil','leader'],body:'<p>Rule: a {{teacher}} checks the points before any prize.</p><p>Photos must not show other students’ {{names}}.</p><p>Responsible: the Year {{leader}}.</p><p>Why is this rule needed?</p>{{reason}}',fields:{teacher:{kind:'auto',label:'Who checks the points',correct:['teacher']},names:{kind:'auto',label:'What photos must not show',correct:['names']},leader:{kind:'auto',label:'Responsible Year role',correct:['leader']},reason:{kind:'open',label:'Why is this rule needed?'}},model:'Rule: a <strong>teacher</strong> checks the points before any prize.<br>Photos must not show other students’ <strong>names</strong>.<br>Responsible: the Year <strong>leader</strong>.<br><strong>Model reason:</strong> The AI alone may be unfair or share names.',allowEquivalent:true},
    {id:20,chapter:3,dok:3,prompt:'Fill in the blanks. Use the word bank. (1 mark)',bank:['points','photos','3','20'],body:'<p>Measure: the average {{points}} per student for each handwriting style.</p><p>Pause if: students lose points for {{weeks}} weeks in a row.</p><p>Why measure this?</p>{{reason}}',fields:{points:{kind:'auto',label:'What to measure',correct:['points']},weeks:{kind:'auto',label:'Number of weeks',correct:['3']},reason:{kind:'open',label:'Why measure this?'}},model:'Measure: the average <strong>points</strong> per student for each handwriting style.<br>Pause if: students lose points for <strong>3</strong> weeks in a row.<br><strong>Model reason:</strong> To see if untidy handwriting is treated unfairly.',allowEquivalent:true}
  ];
  const validModes = ['practice','exam'];
  const freshState = () => ({mode:null,chapter:0,answers:{},reviews:{},examSubmitted:false,results:false});
  let state = loadState();
  const main = document.getElementById('screen');
  const esc = v => String(v == null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = v => String(v == null?'':v).normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!?。،]+$/g,'');
  const anyEntered = q => Object.keys(q.fields).some(k=>Boolean(String((state.answers[q.id]||{})[k]||'').trim()));
  const fieldsOf = (q,kind) => Object.entries(q.fields).filter(([,v])=>v.kind===kind);
  const allOpenFilled = q => fieldsOf(q,'open').every(([k])=>String((state.answers[q.id]||{})[k]||'').trim().length>0);
  const allAutoFilled = q => fieldsOf(q,'auto').every(([k])=>String((state.answers[q.id]||{})[k]||'').trim().length>0);
  const autoMatches = q => fieldsOf(q,'auto').every(([k,field])=>field.correct.some(v=>norm(v)===norm((state.answers[q.id]||{})[k])));
  const displayModel = q => q.model;
  function loadState(){try{const v=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(v && (v.mode===null||validModes.includes(v.mode)) && typeof v.answers==='object' && typeof v.reviews==='object'){return {...freshState(),...v,chapter:Math.max(0,Math.min(3,Number(v.chapter)||0))};}}catch(e){}return freshState()}
  function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
  function attemptCount(){return QUESTIONS.filter(anyEntered).length}
  function checkedCount(){return QUESTIONS.filter(q=>qReview(q).checked).length}
  function qReview(q){return state.reviews[q.id]||{checked:false,self:null,equivalent:false}}
  function outcome(q){
    const rev=qReview(q);if(!rev.checked)return 'unreviewed';
    const autoFields=fieldsOf(q,'auto');const hasOpen=fieldsOf(q,'open').length>0;
    if(!anyEntered(q)||!allAutoFilled(q))return 'incorrect';
    if(hasOpen && !allOpenFilled(q))return 'pending';
    if(hasOpen && rev.self===null)return 'pending';
    const autoOK=autoMatches(q)||(q.allowEquivalent && rev.equivalent===true && allAutoFilled(q) && (!hasOpen || rev.self===true));
    const openOK=!hasOpen||rev.self===true;
    return (autoOK && openOK)?'correct':'incorrect';
  }
  const totalCorrect=()=>QUESTIONS.filter(q=>outcome(q)==='correct').length;
  const pendingCount=()=>QUESTIONS.filter(q=>outcome(q)==='pending').length;
  function setMode(m){state.mode=m;save();render()}
  function start(){state.results=false;state.chapter=0;save();render();scrollTop()}
  function scrollTop(){window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
  function render(){main.innerHTML=!state.mode?renderIntro():(state.results?renderResults():renderQuiz());updateHeaderMode()}
  function updateHeaderMode(){const meta=document.querySelector('.header-meta');if(!meta)return;meta.innerHTML=`<span class="pill green">✦ Grade 8</span><span class="pill gold">Term 1 · 2026</span>${state.mode?`<span class="pill">${state.mode==='practice'?'🌈 Practice':'🎯 Exam'} mode</span>`:''}`}
  function renderIntro(){return `<section class="intro" aria-labelledby="welcome-title"><div class="intro-grid"><div class="intro-copy"><span class="eyebrow">✦ Learn. Try. Improve.</span><h1 id="welcome-title">Your AI adventure <em>starts here!</em></h1><p>Explore real-world AI challenges, test your ideas and build confidence for your Grade 8 Term 1 assessment.</p><div class="intro-stats"><div class="intro-stat"><strong>20</strong><span>Questions</span></div><div class="intro-stat"><strong>4</strong><span>Missions</span></div><div class="intro-stat"><strong>2</strong><span>Ways to play</span></div></div></div><div class="intro-panel"><h2>Choose your adventure 🎮</h2><p>Same original questions, two ways to practise.</p><button class="mode-choice" data-action="mode" data-mode="practice" aria-pressed="true"><span class="mode-icon">🌟</span><span><strong>Practice mode</strong><small>Check answers as you go, see explanations and learn from mistakes.</small></span></button><button class="mode-choice" data-action="mode" data-mode="exam" aria-pressed="false"><span class="mode-icon">🎯</span><span><strong>Exam mode</strong><small>Complete the challenge first, then unlock your answer key and review.</small></span></button><button class="btn primary full" data-action="begin">Let's begin! <span aria-hidden="true">→</span></button><p class="tiny-note">Your work is saved in this browser only. No login needed.</p></div></div><div class="mission-peek">${CHAPTERS.map((c,i)=>`<div class="peek-card"><div class="peek-icon" aria-hidden="true">${c.icon}</div><b>${esc(c.short)}</b><span>Mission ${i+1} · ${c.range}</span></div>`).join('')}</div></section>`}
  let stagedMode='practice';
  function chapterAnswered(i){return QUESTIONS.filter(q=>q.chapter===i&&anyEntered(q)).length}
  function chapterChecked(i){return QUESTIONS.filter(q=>q.chapter===i&&qReview(q).checked).length}
  function renderSidebar(){return `<aside class="sidebar" aria-label="Mission navigation"><div class="side-panel"><div class="side-heading">Your missions</div><nav class="mission-links" aria-label="Choose mission">${CHAPTERS.map((c,i)=>`<button class="mission-link" data-action="chapter" data-index="${i}" ${i===state.chapter?'aria-current="step"':''}><span class="mission-emoji" aria-hidden="true">${c.icon}</span><span><span class="mission-name">${esc(c.short)}</span><span class="mission-details">${chapterAnswered(i)}/5 attempted</span></span><span class="mission-check" aria-hidden="true">${chapterChecked(i)===5?'✓':''}</span></button>`).join('')}</nav><hr class="side-break"><div class="side-footer"><b>${attemptCount()} / 20</b> questions attempted<div class="side-progress"><div class="side-progress-fill" style="width:${attemptCount()*5}%"></div></div><span>${state.mode==='practice'?`${checkedCount()} checked`:state.examSubmitted?'Exam submitted':'Answers hidden until submission'}</span></div></div></aside>`}
  function renderScenario(c){return `<section class="scenario" aria-label="Scenario and key vocabulary"><div class="scenario-head"><span class="scenario-bubble" aria-hidden="true">📋</span><h2>Explore the scenario</h2></div>${c.scenario}<div class="words"><div class="words-title">📚 Words to know</div><div class="words-grid">${c.words.map(w=>`<span class="word-chip"><strong>${esc(w[0])}</strong> – ${esc(w[1])}</span>`).join('')}</div></div></section>`}
  function renderQuiz(){const c=CHAPTERS[state.chapter];return `<div class="workspace">${renderSidebar()}<div class="workspace-content"><div class="top-tools"><div class="tool-left"><span class="pill">${state.mode==='practice'?'🌈 Instant feedback':'🎯 Exam mode'}</span><span class="pill">${state.examSubmitted?'🔓 Answers unlocked':'🔒 '+(state.mode==='practice'?'Check as you go':'Answers hidden')}</span></div><div class="tool-right"><button class="btn small secondary" data-action="results">📊 My progress</button><button class="btn small ghost" data-action="reset">↻ Restart</button></div></div><section class="chapter-hero" style="--chapter-ambient:${c.ambient}" aria-labelledby="chapter-title"><span class="chapter-mascot" aria-hidden="true">${c.icon}</span><div class="chapter-tag">${esc(c.label)} · ${esc(c.range)}</div><h1 id="chapter-title">${esc(c.title)}</h1><p>${esc(c.subtitle)}</p><div class="chapter-labels"><span class="pill">${esc(c.strand)}</span><span class="pill gold">5 questions · 5 marks</span></div></section><div class="progress-shell" aria-label="Overall answer progress"><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="${attemptCount()}" aria-label="Questions attempted"><div style="width:${attemptCount()*5}%"></div></div><span>${attemptCount()}/20 attempted</span></div>${renderScenario(c)}<div class="questions-list">${QUESTIONS.filter(q=>q.chapter===state.chapter).map(renderQuestion).join('')}</div><nav class="chapter-nav" aria-label="Mission pages"><button class="btn secondary" data-action="prev" ${state.chapter===0?'disabled':''}>← Previous</button><span class="nav-hint">Mission ${state.chapter+1} of 4</span>${state.chapter===3?`<button class="btn primary" data-action="${state.mode==='exam'&&!state.examSubmitted?'submitExam':'results'}">${state.mode==='exam'&&!state.examSubmitted?'Submit exam ✓':'View results →'}</button>`:`<button class="btn primary" data-action="next">Next mission →</button>`}</nav>${state.mode==='exam'&&!state.examSubmitted?`<p class="tiny-note">Exam mode: your answers and progress are saved. Feedback will appear only after you submit the exam.</p>`:''}</div></div>`}
  function fieldHTML(q,key){const f=q.fields[key];if(!f)return '';const v=esc((state.answers[q.id]||{})[key]||'');const id=`q${q.id}_${key}`;return f.kind==='open'?`<textarea class="open-field" id="${id}" data-q="${q.id}" data-field="${key}" aria-label="${esc(f.label)}" placeholder="Write your answer here..." rows="2">${v}</textarea>`:`<input class="blank ${f.label.length>21?'long':''}" id="${id}" type="text" data-q="${q.id}" data-field="${key}" aria-label="${esc(f.label)}" value="${v}" autocomplete="off" spellcheck="false" />`}
  function tableHTML(q,rows,headerA,headerB){return `<div class="responsive-table"><table class="answer-table"><thead><tr><th scope="col">${esc(headerA)}</th><th scope="col">${esc(headerB)}</th></tr></thead><tbody>${rows.map(([label,key])=>`<tr><th scope="row">${esc(label)}</th><td>${fieldHTML(q,key)}</td></tr>`).join('')}</tbody></table></div>`}
  function choicesHTML(q){const val=(state.answers[q.id]||{}).choice||'';return `<div class="option-stack" role="radiogroup" aria-label="Question ${q.id}: ${esc(q.prompt)}">${q.options.map(([letter,caption])=>`<label class="option-label"><input type="radio" name="q${q.id}_choice" data-q="${q.id}" data-field="choice" value="${letter}" ${val===letter?'checked':''}/><span class="letter">${letter}</span><span class="option-text">${esc(caption)}</span></label>`).join('')}</div>`}
  function riskHTML(q){const cats=['Privacy','Fairness','No human check'];return `<div class="responsive-table"><table class="answer-table risk-grid"><thead><tr><th scope="col">Problem</th>${cats.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${['p1','p2','p3'].map(k=>`<tr><th scope="row">${k.toUpperCase()}</th>${cats.map(v=>`<td><label class="risk-radio"><input type="radio" data-q="${q.id}" data-field="${k}" name="q${q.id}_${k}" value="${esc(v)}" aria-label="${k.toUpperCase()}: ${esc(v)}" ${((state.answers[q.id]||{})[k]||'')===v?'checked':''}/></label></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  function flowHTML(q){return `<div class="flow-steps"><div class="flow-node"><b>INPUT</b>Topic of the week (no names)</div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node"><b>PROCESS</b>The AI writes a short tip</div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node test"><b>TEST</b>${fieldHTML(q,'test')}</div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node"><b>OUTPUT</b>Tip for the class board</div></div>`}
  function questionBody(q){const specials={accuracyTable:()=>tableHTML(q,[['A','a'],['B','b']],'Design','Accuracy (%)'),spellingTable:()=>tableHTML(q,[['Quiet room accuracy','quiet'],['Busy hall accuracy','busy'],['Gap (quiet − busy)','gap']],'Item','Answer'),refinementTable:()=>tableHTML(q,[['Problem found','problem'],['Change made','change'],['Test again and measure','measure']],'Part','Your note'),choice:()=>choicesHTML(q),riskGrid:()=>riskHTML(q),testFlow:()=>flowHTML(q)};return q.body.replace(/\{\{(\w+)\}\}/g,(_,k)=>specials[k]?specials[k]():fieldHTML(q,k))}
  function renderQuestion(q){const rev=qReview(q);const show=rev.checked;const status=outcome(q);const lock=state.mode==='exam'&&state.examSubmitted;return `<article class="question-card ${show?status:''}" id="question-${q.id}" aria-labelledby="q${q.id}-prompt"><div class="q-head"><span class="q-number">QUESTION ${String(q.id).padStart(2,'0')}</span><span class="q-meta">${esc(CHAPTERS[q.chapter].strand)} · DoK ${q.dok} · 1 mark</span>${show?`<span class="q-state ${status==='correct'?'ok':status==='incorrect'?'no':'wait'}">${status==='correct'?'✓ Correct':status==='incorrect'?'↗ Revise answer':'◷ Needs review'}</span>`:''}</div><h3 id="q${q.id}-prompt" class="q-prompt">${esc(q.prompt)}</h3>${q.bank?`<div class="bank"><strong>Word bank</strong>${q.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`:''}<div class="q-body">${questionBody(q)}</div><div class="q-actions">${state.mode==='practice'?`<button class="btn small primary" data-action="check" data-q="${q.id}">${rev.checked?'Check again ↻':'Check answer ✓'}</button>`:state.examSubmitted?`<span class="pill green">Answer key unlocked</span>`:`<span class="pill">Answers revealed after exam</span>`}<span class="hint">${anyEntered(q)?'Answer saved locally':'Ready when you are'}</span></div>${show?renderFeedback(q):''}</article>`}
  function renderFeedback(q){const rev=qReview(q),auto=fieldsOf(q,'auto'),hasOpen=fieldsOf(q,'open').length>0;const autoOk=autoMatches(q),status=outcome(q);const noAnswers=!anyEntered(q);return `<div class="feedback" aria-live="polite"><h3>💡 Answer key & explanation</h3><div class="model">${displayModel(q)}</div>${q.altNote?`<p><strong>Accepted alternative:</strong> ${esc(q.altNote)}</p>`:''}${auto.length?`<p class="judge ${autoOk?'ok':'no'}">${autoOk?'✓ Auto-checked parts match the answer key.':'↗ Some auto-checked parts differ from the model answer.'}</p>`:''}${q.allowEquivalent && !autoOk && allAutoFilled(q)?`<label class="switch-line"><input type="checkbox" data-action="equivalent" data-q="${q.id}" ${rev.equivalent?'checked':''}/><span>My different wording/rating is still correct and I have checked it carefully against the model answer. <strong>Count as an accepted equivalent.</strong></span></label>`:''}${hasOpen?`<div class="selfcheck"><h4>✏️ Self-check your written answer</h4><p class="muted-note">Compare <strong>every written part</strong> with the model answer. The source accepts clear, correct reasons in your own words. Your response must be filled in to receive credit.</p><div class="self-buttons"><button class="self-btn ${rev.self===true?'active-good':''}" data-action="self" data-q="${q.id}" data-value="yes" aria-pressed="${rev.self===true}">✓ My answer is accurate</button><button class="self-btn ${rev.self===false?'active-revise':''}" data-action="self" data-q="${q.id}" data-value="no" aria-pressed="${rev.self===false}">↻ I need to revise it</button></div></div>`:''}<p class="judge ${status==='correct'?'ok':status==='incorrect'?'no':'pending'}">${status==='correct'?'★ 1 / 1 mark — every required part is correct.':status==='pending'?'◷ Mark pending — complete the response and self-review the explanation.':noAnswers?'↗ No answer entered yet.':'0 / 1 mark for now — the source gives one mark only if all parts are correct.'}</p></div>`}
  function renderResults(){const done=checkedCount(),pending=pendingCount(),right=totalCorrect();return `<section class="results" aria-labelledby="results-title"><div class="top-tools"><div class="tool-left"><span class="pill">📊 Your progress</span></div><div class="tool-right"><button class="btn small secondary" data-action="back">← Back to missions</button><button class="btn small ghost" data-action="reset">↻ Restart</button></div></div><div class="results-hero"><span class="eyebrow">✨ Your learning dashboard</span><h1 id="results-title">Look how far you've come!</h1><p>${state.mode==='exam'&&!state.examSubmitted?'Your exam answers are saved, but the answer key stays locked until you submit.':pending>0?'Review your written explanations to finish confirming your score.':'Every attempt helps you think more clearly about real-world AI.'}</p>${state.mode==='exam'&&!state.examSubmitted?`<button class="btn dark" data-action="submitExam">Submit exam & unlock answers →</button>`:''}</div><div class="results-metrics"><div class="metric"><strong>${attemptCount()}/20</strong><span>Questions attempted</span></div><div class="metric"><strong>${state.mode==='exam'&&!state.examSubmitted?'🔒':`${right}/20`}</strong><span>${state.mode==='exam'&&!state.examSubmitted?'Score locked':'Confirmed marks'}</span></div><div class="metric"><strong>${state.mode==='exam'&&!state.examSubmitted?'—':pending}</strong><span>Written reviews pending</span></div></div>${state.mode==='exam'&&!state.examSubmitted?`<div class="results-callout">🔒 In exam mode, the answer key and scoring are unlocked after submission. You can go back to revise your answers first.</div>`:pending?`<div class="results-callout">📝 <strong>${pending} question${pending===1?'':'s'} need${pending===1?'s':''} self-assessment.</strong> Open the missions below, compare the written answers with the source key, and choose whether each explanation is accurate. Scoring uses all-or-nothing marks per question, just as in the source document.</div>`:''}<h2 style="font-size:20px;letter-spacing:-.5px;margin:26px 0 13px">Mission breakdown</h2><div class="result-missions">${CHAPTERS.map((c,i)=>{const qs=QUESTIONS.filter(q=>q.chapter===i),right=qs.filter(q=>outcome(q)==='correct').length,attempted=qs.filter(anyEntered).length;return `<div class="result-mission"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><strong>${c.icon} ${esc(c.short)}</strong><span class="score">${state.mode==='exam'&&!state.examSubmitted?'—':right+'/5'}</span></div><p class="tiny-note" style="margin:7px 0 0">${attempted}/5 attempted · ${esc(c.strand)}</p><div class="mini-rail"><div style="width:${attempted*20}%"></div></div><button class="btn small secondary" data-action="chapter" data-index="${i}">${state.mode==='exam'&&!state.examSubmitted?'Continue mission':'Review mission'} →</button></div>`}).join('')}</div><div class="result-footer">${state.mode==='exam'&&!state.examSubmitted?'':`<button class="btn secondary" data-action="print">🖨️ Print results / Save as PDF</button>`}<button class="btn coral" data-action="reset">↻ Start fresh</button></div><p class="tiny-note">Each question is worth 1 mark. Tables, tick grids and blanks receive the mark only when all required parts are correct. Written explanations are self-assessed against the provided model answer; this is not teacher grading.</p></section>`}
  function patchQuestion(qId){const q=QUESTIONS.find(x=>x.id===qId);const current=document.getElementById(`question-${qId}`);if(!q||!current)return;const next=document.createElement('div');next.innerHTML=renderQuestion(q);current.replaceWith(next.firstElementChild)}
  function patchProgress(){document.querySelectorAll('.progress-shell .track').forEach(e=>{e.setAttribute('aria-valuenow',attemptCount());const fill=e.querySelector('div');if(fill)fill.style.width=(attemptCount()*5)+'%'});document.querySelectorAll('.progress-shell>span').forEach(e=>e.textContent=`${attemptCount()}/20 attempted`);document.querySelectorAll('.mission-details').forEach((el,i)=>el.textContent=`${chapterAnswered(i)}/5 attempted`);document.querySelectorAll('.mission-check').forEach((el,i)=>el.textContent=chapterChecked(i)===5?'✓':'');const sp=document.querySelector('.side-progress-fill');if(sp)sp.style.width=(attemptCount()*5)+'%';const sf=document.querySelector('.side-footer>b');if(sf)sf.textContent=`${attemptCount()} / 20`;}
  function changeAnswer(el){const qId=Number(el.dataset.q),key=el.dataset.field;if(!Number.isInteger(qId)||!key)return;state.answers[qId]??={};state.answers[qId][key]=el.value;const review=state.reviews[qId];if(review && state.mode==='practice'){review.checked=false;review.self=null;review.equivalent=false}if(state.mode==='exam'&&state.examSubmitted){ // Reassessment after submission is allowed; the source key remains visible.
    if(review){review.self=null;review.equivalent=false}
  }save();patchProgress();const card=el.closest('.question-card');if(card){const hint=card.querySelector('.q-actions .hint');if(hint)hint.textContent='Answer saved locally';if(state.mode==='practice'&&review?.checked===false){card.classList.remove('correct','incorrect','pending');const feedback=card.querySelector('.feedback');if(feedback)feedback.remove();const badge=card.querySelector('.q-state');if(badge)badge.remove();const check=card.querySelector('[data-action="check"]');if(check)check.textContent='Check answer ✓';}}
  }
  function setReview(qId,patch){const r=state.reviews[qId]||{checked:false,self:null,equivalent:false};state.reviews[qId]={...r,...patch};save();patchQuestion(qId);patchProgress()}
  function jumpToChapter(index){state.chapter=Math.max(0,Math.min(3,index));state.results=false;save();render();scrollTop()}
  function reset(){if(window.confirm('Start fresh? This will erase your saved answers and self-assessments in this browser.')){state=freshState();stagedMode='practice';save();render();scrollTop()}}
  function submitExam(){if(state.examSubmitted){state.results=true;render();scrollTop();return}const missing=QUESTIONS.filter(q=>!anyEntered(q)).length;if(missing && !window.confirm(`You have ${missing} unanswered question${missing!==1?'s':''}. Submit your exam anyway and unlock the answer key?`))return;state.examSubmitted=true;for(const q of QUESTIONS){const r=qReview(q);state.reviews[q.id]={...r,checked:true,self:null,equivalent:false}}state.results=true;save();render();scrollTop()}
  function toast(s){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2800)}
  document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-field]') && el.type!=='radio')changeAnswer(el)});
  document.addEventListener('change',e=>{const el=e.target;if(el.matches('input[type="radio"][data-field]')){changeAnswer(el)} else if(el.matches('input[data-action="equivalent"]')){setReview(Number(el.dataset.q),{equivalent:el.checked})}});
  document.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const a=btn.dataset.action;
    if(a==='mode'){stagedMode=btn.dataset.mode;document.querySelectorAll('.mode-choice').forEach(x=>x.setAttribute('aria-pressed',x===btn?'true':'false'))}
    else if(a==='begin'){state.mode=stagedMode;start()}
    else if(a==='chapter')jumpToChapter(Number(btn.dataset.index));
    else if(a==='prev')jumpToChapter(state.chapter-1);
    else if(a==='next')jumpToChapter(state.chapter+1);
    else if(a==='check'){const qId=Number(btn.dataset.q);const q=QUESTIONS.find(x=>x.id===qId);if(!q)return;const previous=qReview(q);setReview(qId,{checked:true,self:previous.checked?previous.self:null,equivalent:previous.checked?previous.equivalent:false});}
    else if(a==='self'){setReview(Number(btn.dataset.q),{checked:true,self:btn.dataset.value==='yes'})}
    else if(a==='results'){state.results=true;save();render();scrollTop()}
    else if(a==='back'){state.results=false;save();render();scrollTop()}
    else if(a==='submitExam')submitExam();
    else if(a==='reset')reset();
    else if(a==='print')window.print();
  });
  // Preserve an existing mode across reloads; initial mode choice is Practice.
  render();
  </script>
</body>
</html>
